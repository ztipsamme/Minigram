name: Deploy Minigram Frontend

on: push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./starter-mingram/MinGram.csproj

      - name: Build
        run: dotnet build ./starter-mingram/MinGram.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./starter-mingram/MinGram.csproj --configuration Release --output ./publish --no-build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: mingram-ui-maritiman-se
          package: ./publish